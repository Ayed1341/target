name: Build Android APK - Router Manager by Ayed Oraybi

on:
  push:
    branches:
      - 'claude/band-scanner-android-app-wd4ne7'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets (React + Vite)
        run: npm run build:only

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK platforms and tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Write real gradlew wrapper
        run: |
          cat > android/gradlew << 'GRADLEW'
          #!/bin/sh
          exec gradle "$@"
          GRADLEW
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build Release APK (unsigned, signed with debug key)
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: List built APKs
        run: find android/app/build/outputs -name "*.apk" 2>/dev/null | head -20

      - name: Rename and collect APK
        run: |
          mkdir -p release-apk
          # Try release APK first, fall back to debug
          if ls android/app/build/outputs/apk/release/*.apk 2>/dev/null; then
            cp android/app/build/outputs/apk/release/app-release*.apk \
               "release-apk/RouterManager-AyedOraybi-v8.0.apk"
          elif ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null; then
            cp android/app/build/outputs/apk/debug/app-debug.apk \
               "release-apk/RouterManager-AyedOraybi-v8.0-debug.apk"
          fi
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterManager-APK-v8.0
          path: release-apk/
          retention-days: 90

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v8.0.${{ github.run_number }}"
          name: "Router Manager v8.0 - عايد عريبي (Ayed Oraybi)"
          body: |
            ## 📡 Router Manager v8.0 - عايد عريبي (Ayed Oraybi)

            ### تحميل APK / Download APK:
            انقر على الملف أدناه لتنزيل التطبيق مباشرة
            Click the file below to download the APK directly

            ### المميزات / Features:
            - ✅ Band Scanner — ماسح الترددات الحي (B1/B3/B7/B8/B20/B28/n78...)
            - ✅ Best Band Finder — أفضل نطاق ترددي تلقائياً
            - ✅ Cell Tower Scanner — ماسح أبراج الاتصال مع RSRP/PCI/EARFCN
            - ✅ Band Lock (4G/5G) — قفل النطاق الترددي
            - ✅ Cell Lock — قفل برج محدد
            - ✅ RSRP / RSRQ / SINR Monitor — مراقبة إشارة حية
            - ✅ EARFCN / ARFCN Scanner — قياس الترددات الدقيقة
            - ✅ Network Mode Selector — 4G Only / 5G NSA / 5G SA / Auto
            - ✅ Band Aggregation Info — CA معلومات دمج النطاقات
            - ✅ Cell ID Information — معلومات الخلية والبرج
            - ✅ Historical Signal Data — سجل زمني للإشارة
            - ✅ Speed Test — اختبار السرعة مع Ping/Jitter
            - ✅ Export Diagnostics — تصدير JSON كامل
            - ✅ **17 Advanced Auth Layers** — 17 طريقة مصادقة متقدمة

            ### الراوترات المدعومة:
            - **Huawei**: B310, B315, B525, B715, CPE Pro, وجميع طرازات HiLink
            - **ZTE**: MF286, MF289, MC888, MC801, وجميع طرازات ZTE 4G/5G

            ### المتطلبات:
            - Android 8.0+ (يعمل على Android 14, 15, 16)
            - اتصال WiFi بنفس شبكة الراوتر

            ### المطور / Developer:
            **عايد عريبي (Ayed Oraybi)**
            Zero placeholders | Zero simulation | Real API Only
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
