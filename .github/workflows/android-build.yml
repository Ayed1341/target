name: Build Android APK

# Builds an installable .apk for the Zain H155 Manager and uploads it as a
# downloadable artifact. Self-contained build on ubuntu-latest (no third-party
# build action, so it doesn't break on stale base images).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/upgrade-v40-s4y1i
    paths:
      - 'android/**'
      - 'zain_h155_manager.py'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libltdl-dev + libtool-bin provide the libtool m4 macros
          # (LT_SYS_SYMBOL_USCORE) that p4a's libffi autoreconf needs.
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            gettext autopoint pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" buildozer

      - name: Copy shared engine into the app
        run: cp zain_h155_manager.py android/engine.py

      - name: Cache Buildozer SDK/NDK & build dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build the APK (debug)
        working-directory: android
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE=1
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: h155-manager-apk
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Publish APK to a GitHub Release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Zain H155 Manager — Android APK (latest)
          body: |
            Installable debug APK for the Zain H155 Manager (arm64-v8a, Android 14/15/16).
            Download the .apk below, copy to your phone, allow "install unknown apps", install.
          files: android/bin/*.apk
          fail_on_unmatched_files: true

      - name: Commit the built APK into the branch
        run: |
          mkdir -p apk
          cp android/bin/*.apk apk/zain-h155-manager.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/zain-h155-manager.apk
          # [skip ci] keeps this commit from re-triggering the build
          git commit -m "Add built APK (arm64) for S24 Ultra [skip ci]" || { echo "no change"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
