name: Build AI Vision Lite APK

# Builds the Debug + Release APKs on GitHub's runners (which can reach Google's
# Android servers) and publishes them to a GitHub Release with stable download URLs.

on:
  push:
    branches:
      - claude/android-apk-build-zhvd34
      - claude/apk-connection-model-fix-gm34zx
    paths:
      - 'aivision-lite/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aivision-lite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: aivision-lite/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: aivision-lite/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p ../apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk ../apk-out/aivision-lite-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk ../apk-out/aivision-lite-release.apk
          ls -la ../apk-out

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivision-lite-apks
          path: apk-out/*.apk

      - name: Publish APKs to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AI Vision Lite APK (latest)
          body: |
            Automated build of AI Vision Lite.
            - aivision-lite-debug.apk   — Debug build (installable directly)
            - aivision-lite-release.apk — Release build (R8-shrunk, signed)
          files: |
            apk-out/aivision-lite-debug.apk
            apk-out/aivision-lite-release.apk
